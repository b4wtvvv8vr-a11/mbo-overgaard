<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Dømi um termografiska mynd av einum húsi">
  <defs>
    <!-- cold outside air -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08122e"/>
      <stop offset="1" stop-color="#101a3a"/>
    </linearGradient>
    <!-- well-insulated wall: cool blue/purple -->
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2a6e"/>
      <stop offset="1" stop-color="#243a86"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c1e5a"/>
      <stop offset="1" stop-color="#2a2c68"/>
    </linearGradient>
    <!-- hot heat-leak glow: white → yellow → orange → transparent -->
    <radialGradient id="hot" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#ffe27a"/>
      <stop offset="0.6" stop-color="#f2994a"/>
      <stop offset="0.85" stop-color="#c0392b"/>
      <stop offset="1" stop-color="#c0392b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="warmstreak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2994a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f2c94c"/>
      <stop offset="1" stop-color="#f2994a" stop-opacity="0"/>
    </linearGradient>
    <!-- temperature scale -->
    <linearGradient id="scale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.15" stop-color="#ffe27a"/>
      <stop offset="0.4" stop-color="#f2994a"/>
      <stop offset="0.6" stop-color="#c0392b"/>
      <stop offset="0.78" stop-color="#37a86b"/>
      <stop offset="1" stop-color="#243a86"/>
    </linearGradient>
    <!-- softens everything to mimic a thermal camera's resolution -->
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="480" height="360" fill="url(#sky)"/>

  <!-- house, softened -->
  <g filter="url(#blur)">
    <!-- ground, slightly warmer than sky -->
    <rect x="0" y="300" width="480" height="60" fill="#1a2350"/>
    <!-- gable body -->
    <path d="M120 300 V150 L240 70 L360 150 V300 Z" fill="url(#wall)"/>
    <!-- roof, cool -->
    <path d="M108 158 L240 60 L372 158 L360 150 L240 78 L120 150 Z" fill="url(#roof)"/>
    <!-- warm streak along the eaves (heat escaping at the roof/wall junction) -->
    <path d="M120 150 L240 78 L360 150" fill="none" stroke="url(#warmstreak)" stroke-width="7" opacity="0.9"/>
    <!-- chimney, warm -->
    <rect x="300" y="96" width="18" height="40" fill="#3a3f8f"/>
  </g>

  <!-- heat-leak hot spots (windows, door, thermal bridges) -->
  <g filter="url(#soft)">
    <!-- left window -->
    <ellipse cx="168" cy="212" rx="34" ry="30" fill="url(#hot)"/>
    <!-- right window -->
    <ellipse cx="312" cy="212" rx="34" ry="30" fill="url(#hot)"/>
    <!-- gable window -->
    <ellipse cx="240" cy="128" rx="24" ry="22" fill="url(#hot)"/>
    <!-- door, warm at the frame -->
    <ellipse cx="240" cy="270" rx="30" ry="40" fill="url(#hot)" opacity="0.92"/>
    <!-- thermal bridge, bottom corner -->
    <ellipse cx="132" cy="292" rx="20" ry="14" fill="url(#hot)" opacity="0.75"/>
  </g>

  <!-- crisp window/door outlines on top so shapes read -->
  <g fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1.4">
    <rect x="150" y="192" width="36" height="42"/>
    <rect x="294" y="192" width="36" height="42"/>
    <rect x="226" y="112" width="28" height="32"/>
    <rect x="222" y="238" width="36" height="62"/>
  </g>

  <!-- temperature scale, like a real thermal camera -->
  <g font-family="Manrope, Arial, sans-serif" font-size="12" fill="#dfe6ff">
    <rect x="440" y="40" width="14" height="260" rx="3" fill="url(#scale)"/>
    <rect x="440" y="40" width="14" height="260" rx="3" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="436" y="46" text-anchor="end">21°C</text>
    <text x="436" y="174" text-anchor="end">9°C</text>
    <text x="436" y="304" text-anchor="end">-3°C</text>
  </g>

  <!-- FLIR-style measurement crosshair on the leakiest window -->
  <g stroke="#ffffff" stroke-width="1.4" fill="none">
    <circle cx="168" cy="212" r="8"/>
    <path d="M168 200 v-6 M168 224 v6 M156 212 h-6 M180 212 h6"/>
  </g>
  <text x="182" y="196" font-family="Manrope, Arial, sans-serif" font-size="12" fill="#ffffff">18,4°C</text>
</svg>
